; ESP32-C3 Super Mini + BNO085 -> BLE head tracker
;
; Arduino is built as an ESP-IDF component ("arduino, espidf") because the
; prebuilt Arduino core has power management (light sleep) switched off.
; The first build takes a few minutes; later builds are quick.
[platformio]
default_envs = esp32c3

[tracker]
; NimBLE's mbuf pool (default 12). Incoming OTA data that finds no free
; mbuf is dropped silently, after the radio has already acknowledged it.
ble_flags =
    -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=48
; Super Mini uses the C3's native USB for Serial
usb_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ${tracker.ble_flags}

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino, espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
build_flags =
    ${tracker.usb_flags}
    ; Shown by tools/ota_update.py. Bump it when you change the firmware.
    -D FW_VERSION=\"1.3.6\"
lib_deps =
    adafruit/Adafruit BNO08x@1.2.5
    h2zero/NimBLE-Arduino@1.4.3
; GY-BNO08X: the library has to ask for the SHTP advertisement
extra_scripts = pre:patch_bno08x.py

; Same firmware without the BNO085: sends simulated head motion, for testing
; Bluetooth, the plugin and OTA before the sensor is wired up.
;   pio run -e esp32c3-fake -t upload
[env:esp32c3-fake]
extends = env:esp32c3
build_flags =
    ${tracker.usb_flags}
    -D FW_VERSION=\"1.2.5-fake\"
    -D FAKE_SENSOR=1

; M5Stack Core (Gray): classic ESP32 with its built-in MPU6886, fusion done in
; the firmware (src/imu6886.h). Same BLE name and protocol as the C3 tracker.
; Flash with esptool from the host; the bootloader goes at 0x1000 on the ESP32.
[env:m5core]
platform = espressif32@6.9.0
board = m5stack-core-esp32
framework = arduino, espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
build_flags =
    ${tracker.ble_flags}
    -D FW_VERSION=\"1.2.13-m5\"
    -D IMU_MPU6886=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/Adafruit NeoPixel@1.12.3
