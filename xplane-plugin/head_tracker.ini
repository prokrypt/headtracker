# HeadTrackerBLE settings. Lives next to the lin_x64 folder:
#   X-Plane 12/Resources/plugins/HeadTrackerBLE/head_tracker.ini
# Changes take effect after Plugins > Plugin Admin > disable/enable, or a restart.

device_name = HeadTrackerC3

# How much the view turns per degree of head movement.
# 1.0 = 1:1, the view follows your real head exactly (turn 30 deg, view turns 30 deg).
# Optional: 2.0 on yaw lets you look over your shoulder while only turning 45 degrees.
gain_yaw = 1.0
gain_pitch = 1.0
gain_roll = 1.0

# Flip an axis if it moves the wrong way.
invert_yaw = false
invert_pitch = false
invert_roll = false

# Optional: degrees of head movement ignored around center (0 = off, true 1:1).
deadzone_deg = 0
# Light smoothing against sensor jitter. Adds a little lag; 0 = off.
smoothing_ms = 15

# Neck model: turning your head also moves your eyes a little, like in real
# life (the eyes are in front of and above the neck pivot). Adjustable in the
# sim under Plugins > Head Tracker > Settings.
neck_model = true
neck_forward_cm = 9
neck_up_cm = 12

# Body turn: past body_threshold_deg of head yaw, the torso takes body_share
# of the extra turn, shifting your eyes like leaning to look over your
# shoulder. body_radius_cm sets how far they shift, body_smoothing_ms how
# lazily the body follows. body_extra_yaw > 0 also turns the view further past
# the threshold (0 keeps the view 1:1 with your head).
body_turn = true
body_threshold_deg = 60
body_share = 0.5
body_radius_cm = 15
body_extra_yaw = 0
body_smoothing_ms = 150

max_yaw = 180
max_pitch = 90
max_roll = 90

# How the tracker sits on your head is measured and stored by the tracker
# itself: Plugins > Head Tracker > Settings > Calibrate.
