<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1500" height="1180" fill="#ffffff"/>
  <text x="750" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#111">BNO085 (GY-BNO08X) → ESP32-C3 Super Mini wiring</text>
  <text x="750" y="88" text-anchor="middle" font-size="19" fill="#555">C3 shown from the BACK (the side with the pin numbers), USB-C up · BNO pins in the GY-BNO08X board's order</text>

  <!-- ===== ESP32-C3 Super Mini, back side ===== -->
  <rect x="415" y="180" width="70" height="56" rx="10" fill="#b8b8b8" stroke="#666" stroke-width="2"/>
  <text x="450" y="214" text-anchor="middle" font-size="14" fill="#333">USB-C</text>
  <rect x="330" y="225" width="240" height="445" rx="14" fill="#1a1a1a" stroke="#000" stroke-width="3"/>
  <rect x="400" y="378" width="100" height="30" fill="#f2f2f2"/>
  <text x="450" y="399" text-anchor="middle" font-size="15" fill="#111">ESP32-C3</text>
  <rect x="400" y="414" width="100" height="30" fill="#f2f2f2"/>
  <text x="450" y="435" text-anchor="middle" font-size="16" fill="#111">Super Mini</text>
  <text x="450" y="712" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Super Mini (back)</text>
  <g font-size="18" font-weight="bold" fill="#fff">
    <text x="366" y="276" fill="#888">5V</text>
    <text x="366" y="322">G</text>
    <text x="366" y="368">3.3</text>
    <text x="366" y="414">4</text>
    <text x="366" y="460" fill="#888">3</text>
    <text x="366" y="506" fill="#888">2</text>
    <text x="366" y="552" fill="#888">1</text>
    <text x="366" y="598" fill="#888">0</text>
  </g>
  <g font-size="18" font-weight="bold" fill="#fff" text-anchor="end">
    <text x="534" y="276">5</text>
    <text x="534" y="322">6</text>
    <text x="534" y="368" fill="#888">7</text>
    <text x="534" y="414" fill="#888">8</text>
    <text x="534" y="460" fill="#888">9</text>
    <text x="534" y="506">10</text>
    <text x="534" y="552" fill="#888">20</text>
    <text x="534" y="598" fill="#888">21</text>
  </g>
  <g fill="#e8c35a" stroke="#8a6d1d" stroke-width="2">
    <circle cx="348" cy="270" r="9"/><circle cx="348" cy="316" r="9"/><circle cx="348" cy="362" r="9"/>
    <circle cx="348" cy="408" r="9"/><circle cx="348" cy="454" r="9"/><circle cx="348" cy="500" r="9"/>
    <circle cx="348" cy="546" r="9"/><circle cx="348" cy="592" r="9"/>
    <circle cx="552" cy="270" r="9"/><circle cx="552" cy="316" r="9"/><circle cx="552" cy="362" r="9"/>
    <circle cx="552" cy="408" r="9"/><circle cx="552" cy="454" r="9"/><circle cx="552" cy="500" r="9"/>
    <circle cx="552" cy="546" r="9"/><circle cx="552" cy="592" r="9"/>
  </g>

  <!-- ===== GY-BNO08X board ===== -->
  <rect x="1005" y="225" width="270" height="445" rx="10" fill="#5b2a86" stroke="#3a1a57" stroke-width="3"/>
  <circle cx="1235" cy="262" r="20" fill="#fff"/>
  <circle cx="1235" cy="630" r="20" fill="#fff"/>
  <rect x="1175" y="400" width="60" height="80" rx="4" fill="#222"/>
  <text x="1140" y="712" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">GY-BNO08X (BNO085)</text>
  <g font-size="19" font-weight="bold" fill="#fff">
    <text x="1046" y="266">VCC</text>
    <text x="1046" y="306">GND</text>
    <text x="1046" y="346">SCL</text>
    <text x="1046" y="386">SDA</text>
    <text x="1046" y="426" fill="#bba8d0">ADO</text>
    <text x="1046" y="466" fill="#bba8d0">CS</text>
    <text x="1046" y="506">INT</text>
    <text x="1046" y="546">RST</text>
    <text x="1046" y="586">PS1</text>
    <text x="1046" y="626">PS0</text>
  </g>
  <g font-size="14" fill="#bba8d0">
    <text x="1100" y="426">n/c</text>
    <text x="1090" y="466">n/c</text>
  </g>
  <g fill="#e8c35a" stroke="#8a6d1d" stroke-width="2">
    <circle cx="1028" cy="260" r="9"/><circle cx="1028" cy="300" r="9"/><circle cx="1028" cy="340" r="9"/>
    <circle cx="1028" cy="380" r="9"/><circle cx="1028" cy="420" r="9"/><circle cx="1028" cy="460" r="9"/>
    <circle cx="1028" cy="500" r="9"/><circle cx="1028" cy="540" r="9"/><circle cx="1028" cy="580" r="9"/>
    <circle cx="1028" cy="620" r="9"/>
  </g>

  <!-- ===== wires ===== -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- VCC to 3V3 (over the top) -->
    <path id="w-vcc" d="M348,362 H240 V135 H900 V260 H1028" stroke="#d62728"/>
    <!-- GND to G (over the top) -->
    <path id="w-gnd" d="M348,316 H270 V165 H860 V300 H1028" stroke="#222"/>
    <!-- SDA to 5 -->
    <path id="w-sda" d="M552,270 H760 V380 H1028" stroke="#1f6fd1"/>
    <!-- INT to 4 (round the bottom) -->
    <path id="w-int" d="M348,408 H300 V760 H950 V500 H1028" stroke="#2ca02c"/>
  </g>
  <!-- wires drawn over others get a white casing so the crossing reads as a hop -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M738,340 H782" stroke="#fff" stroke-width="15"/>
    <path id="w-scl" d="M552,316 H720 V340 H1028" stroke="#e0b000" stroke-width="7"/>
    <path d="M928,540 H972" stroke="#fff" stroke-width="15"/>
    <path id="w-rst" d="M552,500 H800 V540 H1028" stroke="#e67e22" stroke-width="7"/>
    <!-- PS1, PS0 to ground -->
    <path id="w-ps1" d="M1028,580 H982" stroke="#222" stroke-width="7"/>
    <path id="w-ps0" d="M1028,620 H982" stroke="#222" stroke-width="7"/>
  </g>
  <!-- ground symbols (pointing left) -->
  <g stroke="#222" stroke-width="3">
    <line x1="980" y1="568" x2="980" y2="592"/><line x1="973" y1="572" x2="973" y2="588"/><line x1="966" y1="577" x2="966" y2="583"/>
    <line x1="980" y1="608" x2="980" y2="632"/><line x1="973" y1="612" x2="973" y2="628"/><line x1="966" y1="617" x2="966" y2="623"/>
  </g>
  <!-- wire labels -->
  <g font-size="17" font-weight="bold">
    <text x="560" y="128" fill="#d62728">VCC → 3.3</text>
    <text x="560" y="158" fill="#222">GND → G</text>
    <text x="580" y="262" fill="#1f6fd1">SDA → 5</text>
    <text x="580" y="308" fill="#b08800">SCL → 6</text>
    <text x="580" y="492" fill="#e67e22">RST → 10</text>
    <text x="560" y="752" fill="#2ca02c">INT → 4</text>
  </g>

  <!-- ===== table ===== -->
  <g font-size="19">
    <rect x="80" y="830" width="760" height="320" rx="10" fill="#f6f6f6" stroke="#ccc"/>
    <text x="110" y="867" font-weight="bold" fill="#111">BNO085</text>
    <text x="250" y="867" font-weight="bold" fill="#111">C3 pin</text>
    <text x="400" y="867" font-weight="bold" fill="#111">Note</text>
    <line x1="100" y1="878" x2="820" y2="878" stroke="#bbb"/>
    <text x="110" y="907">VCC</text><text x="250" y="907">3.3</text><text x="400" y="907" fill="#555">3.3 V, not 5V</text>
    <text x="110" y="937">GND</text><text x="250" y="937">G</text>
    <text x="110" y="967">SCL</text><text x="250" y="967">6</text>
    <text x="110" y="997">SDA</text><text x="250" y="997">5</text>
    <text x="110" y="1027">INT</text><text x="250" y="1027">4</text><text x="400" y="1027" fill="#555">optional, best battery life</text>
    <text x="110" y="1057">RST</text><text x="250" y="1057">10</text><text x="400" y="1057" fill="#555">recommended (auto sensor restart)</text>
    <text x="110" y="1087">PS1, PS0</text><text x="250" y="1087">GND</text><text x="400" y="1087" fill="#555">I2C mode; any GND, e.g. the BNO's own</text>
    <text x="110" y="1117">ADO, CS</text><text x="250" y="1117">—</text><text x="400" y="1117" fill="#555">leave unconnected</text>
  </g>
  <g font-size="17" fill="#333">
    <text x="880" y="855" font-weight="bold" font-size="19" fill="#111">Notes</text>
    <text x="880" y="890">• Wires that hop over each other</text>
    <text x="880" y="914">  are not connected</text>
    <text x="880" y="948">• Seen from the button side, the C3's</text>
    <text x="880" y="972">  two pin rows swap sides</text>
    <text x="880" y="1006">• Sensor address 0x4A or 0x4B both work</text>
    <text x="880" y="1040">• C3 BOOT button (GPIO9) = recenter;</text>
    <text x="880" y="1064">  GPIO8 = onboard LED</text>
    <text x="880" y="1098">• M5Stack Core stand-in: no wiring needed</text>
  </g>
</svg>
